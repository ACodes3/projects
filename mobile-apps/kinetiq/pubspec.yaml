name: kinetiq
version: 2.0.0+1
description: KINETIQ 2.0 - Offline-first fitness and nutrition tracking, without AI.
publish_to: none

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  file_selector: ^1.1.0
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  uuid: ^4.6.0
  path_provider: ^2.1.5
  share_plus: ^13.3.1
  cross_file: ">=0.3.5+5 <0.4.0"


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
